<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AD Smart</title>
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f9; --ink: #15171d; --muted: #5a6070; --primary: #0048a9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131417; --ink: #f2f3f6; --muted: #a4a9b6; --primary: #2a6cd6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--ink);
           font: 1rem/1.6 system-ui, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 26rem; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    a { display: inline-block; padding: .65rem 1.5rem; border-radius: 999px; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>AD Smart could not reach the server. Check your internet connection, then try again.</p>
    <a href="https://adsmarttech.com/staff/">Try again</a>
  </main>
</body>
</html>
