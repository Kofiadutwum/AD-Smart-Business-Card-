# Render blueprint for AD Smart Business Cards (Django).
# Secrets marked sync: false are entered in the Render dashboard, never here.
# Everything runs in Frankfurt, Render's closest region to Ghana, and the
# database sits in the same region as the web service.
#
# THIS IS THE FREE TEST SETUP. Before real customers use it:
#   1. web service   plan: free  ->  plan: starter   (free sleeps after 15 min idle;
#                                                     the next visitor waits ~1 minute)
#   2. database      plan: free  ->  plan: basic-256mb (free databases are deleted
#                                                     30 days after creation)
#   3. uncomment the adsmart-daily cron job at the bottom (cron needs a paid plan)
#      and delete .github/workflows/daily-jobs.yml, which stands in for it on free
databases:
  - name: adsmart-db
    region: frankfurt
    plan: free
    databaseName: adsmart
    user: adsmart

services:
  - type: web
    name: adsmart-web
    region: frankfurt
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adsmart-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      # "1" simulates payments; set "0" in the dashboard to take real payments
      # (only with live Paystack keys). Sandbox is forced while no key is set.
      - key: PAYMENT_SANDBOX
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Sends email from the business Gmail until a domain is set up in Resend
      # (python manage.py connect_gmail prints it).
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Lets the GitHub "Daily jobs" workflow run the daily job; copy it to
      # the repository's Actions secrets as CRON_SECRET.
      - key: CRON_SECRET
        generateValue: true
      # The first Main Admin is created from these on deploy (no shell on the
      # free plan). Delete DJANGO_SUPERUSER_PASSWORD once you have signed in.
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # The daily job: reminders, grace/inactive notices, NFC follow-ups,
  # payment housekeeping, retention and the exchange rate (06:00 Ghana time).
  # Cron jobs need a paid plan; uncomment when you upgrade.
