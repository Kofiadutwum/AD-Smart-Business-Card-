# Render blueprint for AD Smart Business Cards (Django).
# Secrets marked sync: false are entered in the Render dashboard, never here.
databases:
  - name: adsmart-db
    plan: basic-256mb
    databaseName: adsmart
    user: adsmart

services:
  - type: web
    name: adsmart-web
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 3 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: adsmart-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: PAYMENT_SANDBOX
        value: "1"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # The daily job: reminders, grace/inactive notices, NFC follow-ups,
  # payment housekeeping, retention and the exchange rate (06:00 Ghana time).
  - type: cron
    name: adsmart-daily
    runtime: python
    plan: starter
    schedule: "0 6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_daily_jobs
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        fromService:
          type: web
          name: adsmart-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: adsmart-db
          property: connectionString
      - key: SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
