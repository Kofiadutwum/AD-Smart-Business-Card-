{% load static %}<!doctype html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f1f1f">
  <title>{% trans "You are offline" %} · {{ SITE_NAME }}</title>
  {# Everything this page needs is inside it, so it still shows with no connection. #}
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f9; --ink: #15171d; --muted: #5a6070; --primary: #0048a9; --on-primary: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #131417; --ink: #f2f3f6; --muted: #a4a9b6; --primary: #2a6cd6; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem; background: var(--bg); color: var(--ink);
           font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 26rem; }
    img { display: block; margin: 0 auto 1.25rem; width: 5rem; height: auto; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; line-height: 1.2; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    button { min-height: 2.75rem; padding: 0 1.5rem; border: 0; border-radius: 999px; background: var(--primary); color: var(--on-primary);
             font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="{% static 'brand/logo-96.webp' %}" alt="" width="126" height="96">
    <h1>{% trans "You are offline" %}</h1>
    <p>{% trans "Check your connection, then try again." %}</p>
    <button type="button" onclick="location.reload()">{% trans "Try again" %}</button>
  </main>
</body>
</html>
