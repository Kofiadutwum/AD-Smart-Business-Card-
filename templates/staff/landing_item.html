{% extends "staff/_shell.html" %}
{% block title %}{{ title }} · {{ SITE_NAME }}{% endblock %}
{% block main %}
<div class="page-head"><div><div class="crumbs"><a href="{% url 'staff:landing' %}">Company card</a><span>/</span><span>{{ title }}</span></div><h1>{{ title }}</h1></div></div>
<section class="panel">
  <form method="post" enctype="multipart/form-data" class="form" novalidate>
    {% csrf_token %}
    {% include "components/form_fields.html" %}
    <div class="cluster"><button class="btn btn--primary" type="submit">{% icon "check" 16 %}Save</button><a class="btn btn--ghost" href="{% url 'staff:landing' %}">Cancel</a></div>
  </form>
</section>
{% endblock %}
